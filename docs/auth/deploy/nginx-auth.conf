# /etc/nginx/sites-available/aivtuber-auth（再链接到 sites-enabled/）。域名换成自己的。
# 证书用 certbot 申请：先只放第一个 server 块（listen 80），执行
#   sudo certbot certonly --nginx -d auth.eatconfusion.online
# 拿到证书后再加上第二个 server 块。
server {
    listen 80;
    server_name auth.eatconfusion.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name auth.eatconfusion.online;

    ssl_certificate /etc/letsencrypt/live/auth.eatconfusion.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.eatconfusion.online/privkey.pem;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
